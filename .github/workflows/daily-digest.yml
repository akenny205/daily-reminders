name: Daily Homework Digest

on:
  schedule:
    # 12:00 UTC = 8:00 AM America/New_York during EDT (summer). Fixed UTC cron doesn't
    # follow DST, so this drifts to 7:00 AM ET during EST (winter) — same limitation the
    # previous Claude Code routine had. Adjust the hour here if that ever matters.
    - cron: "0 12 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          CANVAS_BASE_URL: ${{ secrets.CANVAS_BASE_URL }}
          CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
